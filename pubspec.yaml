name: lamsa
description: تطبيق لمسه - خدمات تجميل وسبا للسيدات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # HTTP & Networking
  http: ^1.2.1

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.3
  image_picker: ^1.1.2
  image: ^4.2.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/play_store_512.png"
  adaptive_icon_background: "#F5EDE4"
  adaptive_icon_foreground: "assets/icon/play_store_512.png"
