name: lamsa
description: تطبيق لمسه - خدمات تجميل وسبا للسيدات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.7.7

  # UI & Fonts
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  firebase_messaging: ^14.9.4
  overlay_support: ^2.1.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  image: ^4.2.0
  connectivity_plus: ^6.0.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/play_store_512.png"
  adaptive_icon_background: "#F5EDE4"
  adaptive_icon_foreground: "assets/icon/play_store_512.png"
